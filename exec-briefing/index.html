<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Executive Briefing — AJ's Data &amp; AI Lab</title>
<meta name="description" content="Strategic perspectives for data and AI leaders — less implementation detail, more decision-making clarity.">
<meta name="author" content="Arnay Joshi">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,600;1,8..60,300&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/ajs-lab-core-header.css">
<link rel="stylesheet" href="../assets/css/ajs-lab-core-body.css">
<link rel="stylesheet" href="../assets/css/ajs-lab-core-footer.css">
</head>
<body>

<!-- ═══ NAV + HERO ═══ -->
<script src="../assets/js/site-header-inject.js"></script>

<!-- ═══ PAGE HERO ═══ -->
<div class="page-hero page-hero--compact">
  <div class="page-hero-inner">
    <span class="page-hero-label">Executive Briefing &mdash; For Decision Makers</span>
    <a class="page-hero-label" href="../index.html"> &#8592; All Articles</a>
  </div>
</div>

<!-- ═══ STREAM FEED ═══ -->
<div class="main-wrap">

  <main>
    <div id="stream-feed" class="section-feed stream-index-feed stream-index-feed--single"></div>
  </main>

  <!-- ═══ SIDEBAR ═══ -->
  <aside class="sidebar">
    <script src="../assets/js/author-bio-inject.js"></script>
  </aside>

</div>

<!-- ═══ FOOTER ═══ -->
<script src="../assets/js/site-footer-inject.js"></script>
<script src="../assets/js/components.js"></script>
<script src="../assets/js/site-vars.js"></script>
<script src="assets/js/exec-briefing-articles.js"></script>
<script>

document.addEventListener('DOMContentLoaded', function () {
  var feed = document.getElementById('stream-feed');
  ARTICLES.forEach(function (a) {
    var card = AJSLab.buildCard(a, PILLARS);
    if (a.keyPointers && a.keyPointers.length) {
      var body = card.querySelector('.card-body');
      var footer = card.querySelector('.card-footer');
      var ol = document.createElement('ol');
      ol.className = 'qb-pointers';
      a.keyPointers.forEach(function (pt) {
        var li = document.createElement('li');
        li.textContent = pt;
        ol.appendChild(li);
      });
      body.insertBefore(ol, footer);
    }
    feed.appendChild(card);
  });
});
</script>
</body>
</html>
