<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AJ's Data &amp; AI Lab — Practitioner Perspectives on Data, AI &amp; Engineering Leadership</title>
<meta name="description" content="Practitioner perspectives on building modern data platforms, leading engineering teams at scale, and driving AI-first transformation — by Arnay Joshi.">
<meta name="author" content="Arnay Joshi">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,600;1,8..60,300&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./assets/css/ajs-lab-core-header.css">
<link rel="stylesheet" href="./assets/css/ajs-lab-core-body.css">
<link rel="stylesheet" href="./assets/css/ajs-lab-core-footer.css">
<style>
/* Plain white card bodies — override gradient from ajs-lab-core-body.css */
.card-body { background: #fff; }
.quickbyte-card .card-body { background: #fff; }
</style>
</head>
<body>

<!-- ═══ NAV + HERO ═══ -->
<script src="./assets/js/site-header-inject.js"></script>

<!-- ═══ MAGAZINE HOME ═══ -->
<div class="main-wrap">

  <main id="stream-feed"></main>

  <!-- ═══ SIDEBAR ═══ -->
  <aside class="sidebar">
    <script src="./assets/js/author-bio-inject.js"></script>
    <div id="sidebar-pillars"></div>
  </aside>

</div>

<!-- ═══ FOOTER ═══ -->
<script src="./assets/js/site-footer-inject.js"></script>
<script src="./assets/js/components.js"></script>
<script src="./assets/js/site-vars.js"></script>
<script src="./assets/js/hero-articles.js"></script>
<script>
/* ╔══════════════════════════════════════════════════════════════
   ║  METADATA — edit here to add / update articles and streams
   ╚══════════════════════════════════════════════════════════════ */

/* Stream definitions — order here controls render order on page */
var STREAMS = [
  {
    id:      'practitioner',
    title:   'Practitioner Series \u2014 Deep Dives',
    href:    'practitioner-series/index.html',
    viewAll: 'View all Practitioner Series \u2192'
  },
  {
    id:      'quickbytes',
    title:   'Quick Bytes \u2014 Key Pointers',
    href:    'quick-bytes/index.html',
    viewAll: 'View all Quick Bytes \u2192'
  },
  {
    id:      'executive',
    title:   'Executive Briefing \u2014 For Decision Makers',
    href:    'exec-briefing/index.html',
    viewAll: 'View all Executive Briefing \u2192'
  },
  {
    id:      'spotlight',
    title:   'Spotlight \u2014 Shared Insights',
    href:    'spotlight/index.html',
    viewAll: 'View all Spotlight \u2192'
  }
];

/* ARTICLES loaded from assets/js/hero-articles.js */

/* ╔══════════════════════════════════════════════════════════════
   ║  RENDERER — card/section functions live in components.js (AJSLab.*)
   ╚══════════════════════════════════════════════════════════════ */

document.addEventListener('DOMContentLoaded', function () {
  var feed = document.getElementById('stream-feed');
  STREAMS.forEach(function (stream) {
    var section = AJSLab.buildSection(stream, ARTICLES, PILLARS);
    if (section) {
      feed.appendChild(section);
      AJSLab.initCarousel(section.querySelector('.section-carousel'));
    }
  });

  var pillarsSlot = document.getElementById('sidebar-pillars');
  if (pillarsSlot) { pillarsSlot.appendChild(AJSLab.buildPillarsWidget(PILLARS, ARTICLES)); }
});
</script>
</body>
</html>
